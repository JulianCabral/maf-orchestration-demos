# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.16'
name: maf-03-handoff
services:
  ai-project:
    host: azure.ai.project
    config:
      deployments:
        - name: gpt-5.4-mini
          model:
            format: OpenAI
            name: gpt-5.4-mini
            version: '2026-03-17'
          sku:
            name: GlobalStandard
            capacity: 10
  handoff-agent:
    host: azure.ai.agent
    project: src/handoff-agent
    language: python
    uses:
      - ai-project
    config:
      kind: hosted
      name: handoff-agent
      description: Triage que deriva a especialistas con handoff, multi-turno
      codeConfiguration:
        runtime: python_3_13
        entryPoint: main.py
      protocols:
        - protocol: responses
          version: 2.0.0
      env:
        PYTHONNOUSERSITE: "1"
        AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        CHAT_CLIENT: foundry
      container:
        resources:
          cpu: '0.5'
          memory: 1Gi
infra:
  provider: microsoft.foundry
