# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.16'
name: maf-04-group-chat
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-4.1-mini
        model:
          format: OpenAI
          name: gpt-4.1-mini
          version: '2025-04-14'
        sku:
          name: GlobalStandard
          capacity: 10
  group-chat-agent:
    host: azure.ai.agent
    project: src/group-chat-agent
    language: python
    uses:
      - ai-project
    kind: hosted
    name: group-chat-agent
    description: Chat grupal con redactor y crítico, round-robin o selector
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: PYTHONNOUSERSITE
        value: "1"
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: CHAT_CLIENT
        value: foundry
      - name: GROUP_CHAT_MODE
        value: selector
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
